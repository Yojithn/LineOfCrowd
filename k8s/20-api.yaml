# The API + dashboard. Two copies, so one can die or update while the other serves.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: lineofcrowd
---
# The "Crash camera" button deletes camera pods, so the API needs permission for that, and nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-chaos
  namespace: lineofcrowd
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-pod-chaos
  namespace: lineofcrowd
subjects:
  - kind: ServiceAccount
    name: api
    namespace: lineofcrowd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-chaos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lineofcrowd
  labels: { app.kubernetes.io/part-of: lineofcrowd, role: api }
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { role: api }
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: lineofcrowd, role: api }
    spec:
      serviceAccountName: api
      terminationGracePeriodSeconds: 5
      containers:
        - name: api
          image: lineofcrowd-api:v1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - { name: MODE, value: "k8s" }
            - { name: APP_VERSION, value: "v1" }
            - { name: PUBLIC_URL, value: "" }
            - name: WORKER_API_KEY
              valueFrom: { secretKeyRef: { name: api-auth, key: WORKER_API_KEY } }
            - name: OPERATOR_API_KEY
              valueFrom: { secretKeyRef: { name: api-auth, key: OPERATOR_API_KEY } }
            - name: PIPELINE_TOKEN
              valueFrom: { secretKeyRef: { name: api-auth, key: PIPELINE_TOKEN, optional: true } }
            - name: APP_ENV
              valueFrom: { configMapKeyRef: { name: api-config, key: APP_ENV, optional: true } }
            - name: ENABLE_CHAOS
              valueFrom: { configMapKeyRef: { name: api-config, key: ENABLE_CHAOS, optional: true } }
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lineofcrowd
spec:
  type: NodePort
  selector: { role: api }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
