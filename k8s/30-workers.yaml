# One Deployment per camera. Each runs one pod; Kubernetes restarts it if it dies or freezes.
# Rolling updates start the new pod first and only remove the old one once the new one is healthy
# (maxUnavailable: 0), so a bad release never takes a camera offline. It just never becomes ready,
# and the deploy script rolls it back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-gate
  namespace: crowdsentinel
  labels: { app.kubernetes.io/part-of: crowdsentinel, role: worker, zone: gate }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 30
  minReadySeconds: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { role: worker, zone: gate }
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: crowdsentinel, role: worker, zone: gate }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: camera
          image: crowdsentinel-worker:v1
          imagePullPolicy: IfNotPresent
          env:
            - { name: ZONE, value: "gate" }
            - { name: API_URL, value: "http://api:8080" }
            - { name: VIDEO, value: "/app/videos/gate.mp4" }
            - { name: APP_VERSION, value: "v1" }
            - { name: BROKEN, value: "0" }
            - { name: SIM_AUTOSURGE, value: "150" }
            - { name: FPS, value: "2" }
            - name: WORKER_API_KEY
              valueFrom: { secretKeyRef: { name: api-auth, key: WORKER_API_KEY } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:      # ready = processed a frame in the last 5 s
            exec: { command: ["python", "healthcheck.py", "5"] }
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 2
            timeoutSeconds: 3
          livenessProbe:       # frozen for 15 s = restart the container
            exec: { command: ["python", "healthcheck.py", "15"] }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests: { cpu: 150m, memory: 200Mi }
            limits: { cpu: "1", memory: 600Mi }
---
