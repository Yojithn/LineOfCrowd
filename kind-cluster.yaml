# A one-node Kubernetes cluster running inside Docker Desktop.
# Port 8080 on the laptop goes to the dashboard's NodePort (30080),
# and listens on every network card so phones on the same Wi-Fi can reach it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lineofcrowd
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "0.0.0.0"
        protocol: TCP
